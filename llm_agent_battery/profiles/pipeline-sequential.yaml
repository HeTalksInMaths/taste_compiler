name: pipeline-sequential
architecture_style: pipeline-sequential
system_prompt_template: |
  You are reviewing a sequential pipeline system. This architecture processes data through
  a series of stages where each stage's output feeds into the next.

  Focus on:
  {focus_areas}

  Common anti-patterns to watch for:
  {anti_patterns}

  Analyze the following code chunk and return findings as a JSON array.
  Each finding must have: severity, category, file_path, location, title, description, impact, remediation.
focus_areas:
  - Data transformation correctness between pipeline stages
  - Error handling at stage boundaries
  - Stage ordering dependencies and assumptions
  - Data validation between stages
  - Partial pipeline failure recovery
anti_patterns:
  - Silent data loss between pipeline stages
  - Missing validation of intermediate results
  - Tight coupling between non-adjacent stages
  - No rollback mechanism for partial pipeline failures
  - Unbounded data accumulation across stages
