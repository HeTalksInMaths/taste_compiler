[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalweaver"
version = "5.1.0"
description = "Automated pipeline for discovering, validating, and evolving quality scorers for subjective text improvement goals"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.82",
    "pytest-timeout>=2.1",
]

[project.scripts]
evalweaver = "evalweaver.__main__:main"

[tool.setuptools.packages.find]
include = ["evalweaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
